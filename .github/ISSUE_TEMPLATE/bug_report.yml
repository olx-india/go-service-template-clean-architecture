name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands, config, or code to reproduce the issue.
      placeholder: |
        1. make run
        2. curl http://localhost:8080/health
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Go version
      placeholder: go1.24.6
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
