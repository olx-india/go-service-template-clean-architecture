name: Feature request
description: Suggest an improvement for the template
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This template prioritizes a lightweight scaffold. Feature requests should improve clarity,
        extensibility, or contributor experience—not add full production features (DB, auth, etc.).
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve for adopters or contributors?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you considered.
