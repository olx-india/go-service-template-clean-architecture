site_name: Go Service Template
site_description: >-
  Go microservice template with Clean Architecture: Gin, dependency injection,
  Zap logging, OpenTelemetry, Redis, OpenAPI 3 and Swagger UI, Docker Compose.
site_url: https://olx-india.github.io/go-service-template-clean-architecture/
repo_url: https://github.com/olx-india/go-service-template-clean-architecture
repo_name: olx-india/go-service-template-clean-architecture
edit_uri: edit/main/docs/
copyright: Copyright &copy; OLX India · Apache License 2.0

docs_dir: docs
exclude_docs: |
  README.md
  requirements.txt
  openapi/doc.go

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Customizing: CUSTOMIZING.md
      - Adding a feature: adding-a-feature.md
  - Reference:
      - Architecture: architecture.md
      - Configuration: configuration.md
      - API: api.md
      - Swagger UI: openapi/index.html
      - Observability: observability.md
      - Testing: testing.md
      - Deployment: deployment.md
      - Extending: EXTENDING.md
  - Decisions:
      - "ADR 001: Clean Architecture layers": adr/001-clean-architecture-layers.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/olx-india/go-service-template-clean-architecture
      name: Source on GitHub
  meta:
    - name: keywords
      content: go, golang, microservice template, clean architecture, hexagonal architecture, gin, opentelemetry, redis, openapi, swagger, boilerplate

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    absolute_links: info
    unrecognized_links: info
